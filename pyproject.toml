[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "waygraph"
version = "0.1.0"
description = "Evidence-bearing graph traversal and adaptive shortcuts on Relate"
requires-python = ">=3.11,<3.14"
dependencies = ["relate-db==1.2.0", "mcp>=1.0,<2", "python-dotenv>=1,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
gemini = ["google-genai>=1.0,<2"]
anthropic = ["anthropic>=0.40,<1"]
[project.scripts]
waygraph = "waygraph.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
