*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0f1726,#0a0e14)}

.sub{color:var(--dim);font-size:12px;flex:1;min-width:220px}

#left{display:flex;flex-direction:column;min-width:0}

button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:6px 11px;font:inherit;cursor:pointer}
button:hover{border-color:var(--cyan)}button.on{border-color:var(--gold);color:var(--gold);background:#1a1608}

.edge.reroute{stroke:var(--violet);stroke-width:3.5;opacity:1}

.arc.CANDIDATE{stroke:var(--amber);stroke-width:2.5;stroke-dasharray:7 6}.arc.STALE{stroke:var(--red);stroke-width:4;stroke-dasharray:2 7;animation:pulse 1.1s infinite}

aside h2:first-child{margin-top:0}
.card{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:9px 11px;margin-bottom:8px}
.card .t{font-weight:600}.card.cyan{border-left:3px solid var(--cyan)}.card.gold{border-left:3px solid var(--gold)}.card.crimson{border-left:3px solid var(--red)}
.card .m{color:var(--dim);font-size:12px}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.5px}
.b-VALID{background:#3a2e05;color:var(--gold)}.b-CANDIDATE{background:#3a2405;color:var(--amber)}.b-STALE{background:#3b0d18;color:var(--red)}.b-NONE{background:#1b2536;color:var(--dim)}
code,pre{font:12px ui-monospace,Consolas,monospace}pre{background:#080c14;border:1px solid var(--line);border-radius:7px;padding:8px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:6px 0}
.kv{display:grid;grid-template-columns:104px 1fr;gap:3px 8px;font-size:12px}.kv div:nth-child(odd){color:var(--dim)}.kv div{word-break:break-all}
.ok{color:var(--green)}.bad{color:var(--red)}
.sc{cursor:pointer}.sc.sel{border-color:var(--gold)}
#toast{position:fixed;right:18px;top:74px;max-width:380px;display:none;background:#2a0e15;border:1px solid var(--red);color:#ffc2cd;padding:10px 13px;border-radius:9px;z-index:9}
</style>

/* ---- minimal SHA-256 (works on file:// where crypto.subtle may be unavailable) ---- */
function sha256(str){

  for(var o=0;o<bytes.length;o+=64){var w=[];for(var t=0;t<16;t++)w[t]=(bytes[o+4*t]<<24)|(bytes[o+4*t+1]<<16)|(bytes[o+4*t+2]<<8)|bytes[o+4*t+3];
    for(t=16;t<64;t++){var s0=R(w[t-15],7)^R(w[t-15],18)^(w[t-15]>>>3),s1=R(w[t-2],17)^R(w[t-2],19)^(w[t-2]>>>10);w[t]=(w[t-16]+s0+w[t-7]+s1)|0}
    var a=h[0],b=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
    for(t=0;t<64;t++){var S1=R(e,6)^R(e,11)^R(e,25),ch=(e&f)^(~e&g),t1=(hh+S1+ch+K[t]+w[t])|0,S0=R(a,2)^R(a,13)^R(a,22),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)|0;hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}

/* ---- Python-compatible canonical JSON (sort_keys, compact, ensure_ascii) ---- */
function pyJson(v){

  if(Array.isArray(v))return'['+v.map(pyJson).join(',')+']';
  return'{'+Object.keys(v).sort().map(function(k){return pyJson(k)+':'+pyJson(v[k])}).join(',')+'}';
}
var SEMANTIC=['anchor','cell','role'];
function fingerprint(edges){return sha256(pyJson({version:2,edges:edges.map(function(e){var sp={};SEMANTIC.forEach(function(k){if(e.source_properties&&k in e.source_properties)sp[k]=e.source_properties[k]});return{id:e.id,source:e.source,target:e.target,kind:e.kind,active:e.active,source_properties:sp}})}))}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function short(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s}

var D=JSON.parse(document.getElementById('showcase-data').textContent);
var NODES={},EDGES={},mutated={},cur={scen:0,step:0,timer:null,sel:null};
D.subgraph.nodes.forEach(function(n){NODES[n.id]=n});
D.subgraph.edges.forEach(function(e){EDGES[e.id]=JSON.parse(JSON.stringify(e))});
var BASE_EDGES=JSON.parse(JSON.stringify(EDGES));
var TIERC={Capability:'#22d3ee',CookbookRecipe:'#2dd4bf',Page:'#818cf8',Command:'#fb923c',Flag:'#f472b6',Surface:'#a3e635',Term:'#facc15',Example:'#94a3b8',Section:'#64748b',Problem:'#fb7185',Index:'#c084fc'};

/* ---- live validation, mirrors waygraph.shortcuts.reuse() ---- */
function validate(sc){
  var cur_=sc.origin,found=[];
  for(var i=0;i<sc.evidence.length;i++){
    var e=EDGES[sc.evidence[i]];
    if(!e)return{valid:false,reason:'DEPENDENCY_MISSING',live:null};
    if(e.active!==true)return{valid:false,reason:'DEPENDENCY_INACTIVE',live:null};
    if(e.source!==cur_)return{valid:false,reason:'PATH_DISCONTINUITY',live:null};
    found.push(e);cur_=e.target}

}

function scenario(){return D.scenarios[cur.scen]}
function stepData(){var s=scenario().steps;return s[Math.min(cur.step,s.length-1)]}
function scById(id){return D.shortcuts.filter(function(s){return s.shortcut_id===id})[0]}

function draw(){
  svg.innerHTML='';
  var st=stepData(),sc=scenario(),walked={},visited={};

    if(dep[id]){ln.addEventListener('click',function(){toggleEdge(id)});var t=el('title',{},ln);t.textContent=e.kind+' ('+id.slice(0,22)+'…) — click to '+(e.active===true?'mutate (disable)':'restore')}});

  D.shortcuts.forEach(function(s){var a=NODES[s.origin],b=NODES[s.target];if(!a||!b)return;var es=effStatus(s);

function toggleEdge(id){
  var e=EDGES[id];if(!e)return;
  if(e.active===true){e.active=false;mutated[id]=1;
    var hit=D.shortcuts.filter(function(s){return s.evidence.indexOf(id)>=0&&s.status!=='CANDIDATE'});
    var names=hit.map(function(s){var r=validate(s);return s.title+' → '+effStatus(s).status+' ('+(r.reason||'')+')'});
    toast('Edge '+e.kind+' disabled via the controlled writer.<br>'+(names.length?names.map(esc).join('<br>'):'No promoted shortcut depends on it.'));
  }else{e.active=true;delete mutated[id]}
  refresh();
}
function restoreAll(){EDGES=JSON.parse(JSON.stringify(BASE_EDGES));mutated={};refresh()}
function toast(html){var t=document.getElementById('toast');t.innerHTML=html;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},5200)}

function renderStory(){var sc=scenario(),st=stepData();
  var m=sc.metrics||{};
  document.getElementById('story').innerHTML='<div class="q">Q: '+esc(sc.question)+'</div><div class="h">'+esc(st.headline)+'</div><div class="d">'+esc(st.detail)+'</div>'+
   '<div class="d" style="margin-top:4px"><span class="badge b-'+esc((st.shortcut_override||{}).status||'NONE')+'">'+esc((st.shortcut_override||{}).status||'NONE')+'</span> &nbsp;cursor steps <b>'+esc(st.cursor_steps)+'</b> · graph hops <b>'+esc(st.hops)+'</b> · tool: <code>'+esc(st.tool)+'</code>'+
   (st.error_badge?' · <span class="bad">'+esc(st.error_badge)+'</span>':'')+'</div>';
  document.getElementById('stepno').textContent='step '+(Math.min(cur.step,sc.steps.length-1)+1)+' / '+sc.steps.length;
}
function renderTabs(){var t=document.getElementById('tabs');t.innerHTML='';
  D.scenarios.forEach(function(s,i){var b=document.createElement('button');b.textContent=s.badge||s.title;b.title=s.title;if(i===cur.scen)b.className='on';
    b.onclick=function(){stop();cur.scen=i;cur.step=0;cur.sel=null;refresh()};t.appendChild(b)})}
function renderCards(){var c=document.getElementById('cards');c.innerHTML='';
  D.comparison_cards.forEach(function(k){var d=document.createElement('div');d.className='card '+k.tone;
    d.innerHTML='<div class="t">'+esc(k.phase)+' <span class="badge b-NONE">'+esc(k.badge)+'</span></div><div class="m">'+esc(k.cursor_steps)+' · '+esc(k.mcp_tool_calls)+'<br>'+esc(k.verification)+'<br><b>'+esc(k.outcome)+'</b></div>';c.appendChild(d)})}
function renderShortcuts(){var c=document.getElementById('shortcuts');c.innerHTML='';document.getElementById('scCount').textContent=D.shortcuts.length;
  D.shortcuts.forEach(function(s){var es=effStatus(s),d=document.createElement('div');d.className='card sc'+((cur.sel||scenario().shortcut_id)===s.shortcut_id?' sel':'');
    d.innerHTML='<div class="t"><span class="badge b-'+es.status+'">'+es.status+'</span> '+esc(s.title)+'</div><div class="m">'+esc(s.hop_count)+' hops · walks '+esc(s.walk_count)+' · reuses '+esc(s.reuse_count)+'</div>';
    d.onclick=function(){cur.sel=s.shortcut_id;refresh()};c.appendChild(d)})}
function renderInspector(){var s=scById(cur.sel||scenario().shortcut_id),c=document.getElementById('inspector');if(!s){c.textContent='Select a shortcut.';return}
  var es=effStatus(s),v=es.v,rr=es.status==='STALE'?reroute(s):null;
  c.innerHTML='<div class="card"><div class="kv">'+
   '<div>shortcut_id</div><div>'+esc(s.shortcut_id)+'</div><div>status</div><div><span class="badge b-'+es.status+'">'+es.status+'</span>'+(v.reason&&es.status!=='CANDIDATE'?' <span class="bad">'+esc(v.reason)+'</span>':'')+'</div>'+
   '<div>route</div><div>'+esc(s.path_nodes.join(' → '))+'</div><div>edge kinds</div><div>'+esc(s.edge_kinds.join(' → '))+'</div>'+
   '<div>walk / reuse</div><div>'+esc(s.walk_count)+' / '+esc(s.reuse_count)+'</div>'+
   '<div>stored SHA-256</div><div>'+esc(s.fingerprint)+'</div>'+
   '<div>live SHA-256</div><div class="'+(v.live===s.fingerprint?'ok':'bad')+'">'+esc(v.live||'— cannot recompute: dependency '+(v.reason||'invalid')+' —')+'</div>'+
   '<div>evidence</div><div>'+s.evidence.map(function(e,i){var ed=EDGES[e];return esc((i+1)+'. '+(ed?ed.kind:'?')+(ed&&ed.active!==true?' [MUTATED]':''))}).join('<br>')+'</div>'+
   (rr?'<div>live reroute</div><div class="ok">'+esc(rr.nodes.join(' → '))+'</div>':'')+
   '</div></div>'+
   '<div class="card"><div class="m">Inspect this exact record in the committed single-file store:</div><pre>relate '+esc(D.store.path)+' --read-only\nMATCH (s:DPShortcut {id:\''+esc(s.shortcut_id)+'\'})\nRETURN s.status, s.walk_count, s.reuse_count,\n       s.evidence, s.fingerprint, s.validation_reason</pre></div>'+
   '<div class="card"><div class="m">The browser recomputed the fingerprint above with the same canonical-JSON + SHA-256 rule as <code>waygraph.shortcuts.fingerprint()</code>. Mutate any gold dependency edge in the graph and watch it diverge.</div></div>';
}
function refresh(){renderTabs();renderStory();renderCards();renderShortcuts();renderInspector();draw()}
function stop(){if(cur.timer){clearInterval(cur.timer);cur.timer=null}document.getElementById('bPlay').innerHTML='&#9654; Play'}
function next(){var n=scenario().steps.length;if(cur.step<n-1){cur.step++}else if(cur.scen<D.scenarios.length-1){cur.scen++;cur.step=0;cur.sel=null}else{stop();return}refresh()}
function prev(){if(cur.step>0)cur.step--;else if(cur.scen>0){cur.scen--;cur.step=scenario().steps.length-1;cur.sel=null}refresh()}
document.getElementById('bNext').onclick=function(){stop();next()};document.getElementById('bPrev').onclick=function(){stop();prev()};
document.getElementById('bReset').onclick=function(){stop();cur.scen=0;cur.step=0;cur.sel=null;restoreAll()};
document.getElementById('bClear').onclick=restoreAll;
document.getElementById('bPlay').onclick=function(){if(cur.timer){stop();return}this.innerHTML='&#10074;&#10074; Pause';cur.timer=setInterval(next,1900)};
document.getElementById('subtitle').textContent=D.subtitle;
document.getElementById('cRelate').textContent=D.store.relate_version;document.getElementById('cEnt').textContent=D.store.entities.toLocaleString();
document.getElementById('cRel').textContent=D.store.relationships.toLocaleString();
document.getElementById('cStore').innerHTML='<b>'+esc(D.store.path)+'</b> · '+esc(D.store.size_mb)+' MB';
refresh();
</script>
</body>
</html>
